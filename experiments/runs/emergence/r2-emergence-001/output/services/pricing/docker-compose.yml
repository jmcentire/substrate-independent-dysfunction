version: '3.8'

services:
  pricing:
    build: .
    ports:
      - "8020:8020"
    environment:
      - PORT=8020
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=pricing
      - PG_PASSWORD=pricing
      - PG_DATABASE=pricing
      - REDIS_NODES=redis-1:6379,redis-2:6380
      - AVAILABILITY_SERVICE_URL=http://availability:8010
    depends_on:
      - postgres
      - redis-1
      - redis-2

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
      POSTGRES_DB: pricing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis-1:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redis-2:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
